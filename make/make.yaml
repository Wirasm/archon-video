name: video-make
description: "Topic -> edited vertical short. Pick one of three scripts at a gate; everything else is automatic."
interactive: true
# Reads video.config.yaml from the project and writes nothing into the checkout.
worktree:
  enabled: false
inputs:
  topic: { required: true, description: "What the video is about" }
  kind: { default: social, description: "social (product, marketing and ugc come later)" }
  config: { default: video.config.yaml, description: "Config path, relative to the project" }

nodes:
  - id: preflight
    script: preflight
    runtime: uv
    deps: ["pyyaml>=6"]
    timeout: 60000
    output_format:
      type: object
      properties:
        kind: { type: string }
        format: { type: string }
        config_digest: { type: string }
        length_min: { type: number }
        length_max: { type: number }
        moods: { type: array, items: { type: string } }
        context: { type: string }
      required: [kind, format, config_digest, length_min, length_max, moods, context]

  # ── Hooks: five openings, a pairwise tournament, the best three ──────────
  - id: hooks
    command: hooks
    model: large
    depends_on: [preflight]
    output_format:
      type: object
      properties:
        hooks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              angle: { type: string }
              spoken: { type: string }
              overlay: { type: string }
              first_frame: { type: string }
            required: [id, angle, spoken, overlay, first_frame]
      required: [hooks]

  - id: pairs
    script: pairs
    runtime: uv
    timeout: 30000
    depends_on: [hooks]
    with:
      hooks: $hooks.output.hooks
    output_format:
      type: object
      properties:
        pairs: { type: array, items: { type: object } }
      required: [pairs]

  - id: judge
    include: video-judge-pair
    depends_on: [pairs]
    with:
      context: $preflight.output.context
    fan_out:
      items: "$pairs.output.pairs"
      as: pair
      max_parallel: 5

  - id: rank
    script: rank
    runtime: uv
    timeout: 30000
    depends_on: [judge]
    with:
      hooks: $hooks.output.hooks
      pairs: $pairs.output.pairs
      verdicts: $judge.output
    output_format:
      type: object
      properties:
        top: { type: array, items: { type: object } }
        table: { type: string }
      required: [top, table]

  # ── Scripts and the one human decision ───────────────────────────────────
  - id: scripts
    command: scripts
    model: large
    depends_on: [rank]
    output_format:
      type: object
      properties:
        scripts:
          type: array
          items:
            type: object
            properties:
              hook_id: { type: string }
              title: { type: string }
              narration: { type: string }
              overlay: { type: string }
              first_frame: { type: string }
              notes: { type: string }
            required: [hook_id, title, narration, overlay, first_frame, notes]
      required: [scripts]

  - id: present
    script: present
    runtime: uv
    timeout: 30000
    depends_on: [scripts]
    with:
      top: $rank.output.top
      table: $rank.output.table
      scripts: $scripts.output.scripts
    output_format:
      type: object
      properties:
        text: { type: string }
        ordered: { type: array, items: { type: object } }
      required: [text, ordered]

  - id: pick-gate
    depends_on: [present]
    approval:
      capture_response: true
      message: |
        Pick the script to make. Nothing has been spent on voice or footage yet.

        $present.output.text

        Approve with a comment naming the script (1, 2 or 3) and any edits in plain words.
        An empty comment makes script 1 unchanged. Reject to stop.

  - id: pick
    command: pick
    model: medium
    depends_on: [pick-gate]
    output_format:
      type: object
      properties:
        choice: { type: integer }
        changes: { type: string }
        title: { type: string }
        narration: { type: string }
        overlay: { type: string }
        first_frame: { type: string }
      required: [choice, changes, title, narration, overlay, first_frame]

  - id: copy
    command: copy
    model: medium
    depends_on: [pick]
    output_format:
      type: object
      properties:
        youtube_title: { type: string }
        youtube_description: { type: string }
        youtube_tags: { type: array, items: { type: string } }
        tiktok_caption: { type: string }
        instagram_caption: { type: string }
        hashtags: { type: array, items: { type: string } }
        alt_text: { type: string }
      required: [youtube_title, youtube_description, youtube_tags, tiktok_caption, instagram_caption, hashtags, alt_text]

  # ── Voice, beat plan, cut list ───────────────────────────────────────────
  - id: voice
    script: voice
    runtime: uv
    deps: ["requests>=2.31"]
    timeout: 600000
    depends_on: [pick]
    with:
      narration: $pick.output.narration
    output_format:
      type: object
      properties:
        audio: { type: string }
        words_file: { type: string }
        duration: { type: number }
        provider: { type: string }
        timings: { type: string }
        word_count: { type: integer }
        indexed: { type: string }
      required: [audio, words_file, duration, provider, timings, word_count, indexed]

  - id: beats
    command: beats
    model: large
    depends_on: [voice]
    output_format:
      type: object
      properties:
        mood: { type: string }
        beats:
          type: array
          items:
            type: object
            properties:
              start_word: { type: integer }
              source: { type: string, enum: [stock] }
              visual: { type: string }
              queries: { type: array, items: { type: string } }
              emphasis_word: { type: [integer, "null"] }
              overlay: { type: string }
            required: [start_word, source, visual, queries, emphasis_word, overlay]
      required: [mood, beats]

  - id: edl
    script: edl
    runtime: uv
    timeout: 30000
    depends_on: [beats]
    with:
      plan: $beats.output
    output_format:
      type: object
      properties:
        beats: { type: array, items: { type: object } }
        mood: { type: [string, "null"] }
        total: { type: number }
        table: { type: string }
      required: [beats, mood, total, table]

  # ── Footage: one block instance per beat, inside this run ────────────────
  - id: footage
    include: video-beat
    depends_on: [edl]
    with:
      context: $preflight.output.context
    fan_out:
      items: "$edl.output.beats"
      as: beat
      max_parallel: 3

  # ── Render, measure, store ───────────────────────────────────────────────
  - id: render
    script: render
    runtime: uv
    timeout: 900000
    depends_on: [footage, voice]
    with:
      footage: $footage.output
      overlay: $pick.output.overlay
    output_format:
      type: object
      properties:
        video: { type: string }
        srt: { type: string }
        duration: { type: number }
        music_track: { type: [string, "null"] }
        mood: { type: [string, "null"] }
        loudness_before: { type: object }
      required: [video, srt, duration, music_track, mood, loudness_before]

  - id: qc
    script: qc
    runtime: uv
    timeout: 300000
    depends_on: [render]
    with:
      footage: $footage.output
    output_format:
      type: object
      properties:
        passed: { type: boolean }
        flagged_beats: { type: object }
        measurements: { type: object }
      required: [passed, flagged_beats, measurements]

  - id: store
    script: store
    runtime: uv
    timeout: 120000
    depends_on: [qc, copy]
    with:
      pick: $pick.output
      copy: $copy.output
      footage: $footage.output
    output_format:
      type: object
      properties:
        path: { type: string }
        video: { type: string }
        latest: { type: string }
        qc_passed: { type: boolean }
        flagged_beats: { type: object }
      required: [path, video, latest, qc_passed, flagged_beats]

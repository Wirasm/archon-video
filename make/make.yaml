name: video-make
description: "Brief -> a short video edited by agents. Pick one of three scripts at a gate; a director, a footage scout and an editor make everything else, and the editor's HyperFrames composition is rendered exactly as written."
interactive: true
# Reads video.config.yaml from the project and writes nothing into the checkout.
worktree:
  enabled: false
inputs:
  brief: { required: true, description: "What the video is, in your words: topic, audience, style, anything that matters" }
  config: { default: video.config.yaml, description: "Config path, relative to the project" }

nodes:
  - id: preflight
    script: preflight
    runtime: uv
    deps: ["pyyaml>=6"]
    timeout: 60000
    output_format:
      type: object
      properties:
        format: { type: string }
        config_digest: { type: string }
        length_min: { type: number }
        length_max: { type: number }
        playbook_version: { type: integer }
        context: { type: string }
        recent_openings: { type: string }
        hyperframes: { type: string }
        music: { type: string }
      required: [format, config_digest, length_min, length_max, playbook_version, context, recent_openings, hyperframes, music]

  # Text-only agents get no tools: with a shell, the copy writer once searched
  # the filesystem for "the finished video" instead of reading its prompt.
  - id: hooks
    command: hooks
    allowed_tools: []
    model: large
    depends_on: [preflight]
    output_format:
      type: object
      properties:
        hooks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              angle: { type: string }
              spoken: { type: string }
              overlay: { type: string }
              first_frame: { type: string }
            required: [id, angle, spoken, overlay, first_frame]
      required: [hooks]

  - id: pairs
    script: pairs
    runtime: uv
    timeout: 30000
    depends_on: [hooks]
    with:
      hooks: $hooks.output.hooks
    output_format:
      type: object
      properties:
        pairs: { type: array, items: { type: object } }
      required: [pairs]

  - id: judge
    include: video-judge-pair
    depends_on: [pairs]
    with:
      context: $preflight.output.context
    fan_out:
      items: "$pairs.output.pairs"
      as: pair
      max_parallel: 5

  - id: rank
    script: rank
    runtime: uv
    timeout: 30000
    depends_on: [judge]
    with:
      hooks: $hooks.output.hooks
      pairs: $pairs.output.pairs
      verdicts: $judge.output
    output_format:
      type: object
      properties:
        top: { type: array, items: { type: object } }
        table: { type: string }
      required: [top, table]

  # ── Scripts and the one human decision ───────────────────────────────────
  - id: scripts
    command: scripts
    allowed_tools: []
    model: large
    depends_on: [rank]
    output_format:
      type: object
      properties:
        scripts:
          type: array
          items:
            type: object
            properties:
              hook_id: { type: string }
              title: { type: string }
              narration: { type: string }
              overlay: { type: string }
              first_frame: { type: string }
              notes: { type: string }
            required: [hook_id, title, narration, overlay, first_frame, notes]
      required: [scripts]

  - id: present
    script: present
    runtime: uv
    timeout: 30000
    depends_on: [scripts]
    with:
      top: $rank.output.top
      table: $rank.output.table
      scripts: $scripts.output.scripts
    output_format:
      type: object
      properties:
        text: { type: string }
        ordered: { type: array, items: { type: object } }
      required: [text, ordered]

  - id: pick-gate
    depends_on: [present]
    approval:
      capture_response: true
      message: |
        Pick the script to make. Nothing has been spent on voice or footage yet.

        $present.output.text

        Approve with a comment naming the script (1, 2 or 3) and any edits in plain words.
        An empty comment makes script 1 unchanged. Reject to stop.

  - id: pick
    command: pick
    allowed_tools: []
    model: medium
    depends_on: [pick-gate]
    output_format:
      type: object
      properties:
        choice: { type: integer }
        changes: { type: string }
        title: { type: string }
        narration: { type: string }
        overlay: { type: string }
        first_frame: { type: string }
      required: [choice, changes, title, narration, overlay, first_frame]

  - id: copy
    command: copy
    allowed_tools: []
    model: medium
    depends_on: [pick]
    output_format:
      type: object
      properties:
        youtube_title: { type: string }
        youtube_description: { type: string }
        youtube_tags: { type: array, items: { type: string } }
        tiktok_caption: { type: string }
        instagram_caption: { type: string }
        hashtags: { type: array, items: { type: string } }
        alt_text: { type: string }
      required: [youtube_title, youtube_description, youtube_tags, tiktok_caption, instagram_caption, hashtags, alt_text]

  # ── Voice and word timings ───────────────────────────────────────────────
  - id: voice
    script: voice
    runtime: uv
    deps: ["requests>=2.31", "kokoro-onnx>=0.4", "soundfile>=0.12"]
    timeout: 600000
    depends_on: [pick]
    with:
      narration: $pick.output.narration
    output_format:
      type: object
      properties:
        provider: { type: string }
        duration: { type: number }
        needs_alignment: { type: boolean }
      required: [provider, duration, needs_alignment]

  # Only for providers without word timings (or voice.timings: align). torch is
  # large, so it installs only when this node runs.
  - id: align
    script: align
    runtime: uv
    deps: ["torch>=2.4", "torchaudio>=2.4", "soundfile>=0.12"]
    timeout: 900000
    depends_on: [voice]
    when: "$voice.output.needs_alignment == 'true'"
    output_format:
      type: object
      properties:
        words: { type: integer }
      required: [words]

  - id: words
    script: words
    runtime: uv
    timeout: 30000
    depends_on: [voice, align]
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      properties:
        duration: { type: number }
        provider: { type: string }
        timings: { type: string }
        word_count: { type: integer }
        indexed: { type: string }
      required: [duration, provider, timings, word_count, indexed]

  # ── Direction, footage, edit ─────────────────────────────────────────────
  - id: director
    command: director
    model: large
    allowed_tools: []
    depends_on: [words]
    output_format:
      type: object
      properties:
        treatment: { type: string }
        needs:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              shows: { type: string }
              why: { type: string }
              queries: { type: array, items: { type: string } }
              min_seconds: { type: number }
            required: [id, shows, why, queries, min_seconds]
      required: [treatment, needs]

  # One scout per footage need, inside this run.
  - id: scout
    include: video-scout
    depends_on: [director]
    with:
      context: $preflight.output.context
    fan_out:
      items: "$director.output.needs"
      as: need
      max_parallel: 3

  - id: assemble
    script: assemble
    runtime: uv
    deps: ["pillow>=10"]
    timeout: 600000
    depends_on: [scout]
    with:
      director: $director.output
      footage: $scout.output
    output_format:
      type: object
      properties:
        sheets: { type: array, items: { type: string } }
        assets: { type: string }
        failed: { type: array, items: { type: string } }
      required: [sheets, assets, failed]

  # The editor writes the whole edit as a HyperFrames composition and checks it
  # with the CLI; it needs a shell, files and image reading, nothing else.
  - id: editor
    command: editor
    model: large
    allowed_tools: [Read, Write, Edit, Bash, Glob, Grep]
    depends_on: [assemble]
    output_format:
      type: object
      properties:
        duration: { type: number }
        summary: { type: string }
      required: [duration, summary]

  # ── Render, measure, store ───────────────────────────────────────────────
  - id: render
    script: render
    runtime: uv
    timeout: 7800000
    depends_on: [editor]
    output_format:
      type: object
      properties:
        video: { type: string }
        srt: { type: [string, "null"] }
        duration: { type: number }
        render_seconds: { type: number }
        render_summary: { type: string }
        loudness_before: { type: object }
      required: [video, srt, duration, render_seconds, render_summary, loudness_before]

  - id: qc
    script: qc
    runtime: uv
    deps: ["pillow>=10"]
    timeout: 600000
    depends_on: [render]
    output_format:
      type: object
      properties:
        passed: { type: boolean }
        flags: { type: array, items: { type: string } }
        measurements: { type: object }
      required: [passed, flags, measurements]

  - id: store
    script: store
    runtime: uv
    timeout: 300000
    depends_on: [qc, copy]
    with:
      pick: $pick.output
      pick_comment: $pick-gate.output
      copy: $copy.output
      editor: $editor.output
    output_format:
      type: object
      properties:
        path: { type: string }
        video: { type: string }
        latest: { type: string }
        qc_passed: { type: boolean }
        playbook_version: { type: integer }
        flags: { type: array, items: { type: string } }
      required: [path, video, latest, qc_passed, playbook_version, flags]
